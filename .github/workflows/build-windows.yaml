name: Compilar Executable (.exe) para Windows

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:

      # 1. Descargar el repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configurar Java 21
      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Compilar, ejecutar pruebas y generar el fat JAR
      - name: Compilar con Maven
        run: mvn clean package

      # 4. Obtener versión
      - name: Obtener versión
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev-${GITHUB_RUN_NUMBER}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # 5. Preparar directorio de distribución
      - name: Preparar distribución
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      # 6. Crear aplicación Windows portable
      - name: Generar aplicación portable con jpackage
        shell: powershell
        run: |
          jpackage `
            --type app-image `
            --name "PDF-Organizer" `
            --input target `
            --main-jar "pdf-organizer-1.0.0-all.jar" `
            --main-class "com.example.pdforganizer.Main" `
            --dest dist `
            --app-version "${{ steps.version.outputs.version }}" `
            --vendor "PDF Organizer"

      # 7. Comprimir aplicación portable
      - name: Crear ZIP portable
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"

          Compress-Archive `
            -Path "dist/PDF-Organizer" `
            -DestinationPath "PDF-Organizer-Windows-v$version.zip"

      # 8. Subir artefacto de GitHub Actions
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Organizer-Windows-${{ steps.version.outputs.version }}
          path: "PDF-Organizer-Windows-v${{ steps.version.outputs.version }}.zip"

      # 9. Crear GitHub Release para tags
      - name: Crear GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PDF Organizer ${{ github.ref_name }}
          generate_release_notes: true
          files: "PDF-Organizer-Windows-v${{ steps.version.outputs.version }}.zip"